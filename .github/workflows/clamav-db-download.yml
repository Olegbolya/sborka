name: Скачать базы ClamAV (вручную)

# Раздача баз ClamAV закрыта для российских адресов («Blocked by CDN»), поэтому сервер не может скачать их сам.
# Этот процесс ТОЛЬКО скачивает базы на серверах GitHub и кладёт их в архив «clamav-db» (Artifacts внизу страницы запуска).
# Ни на какой сервер он ничего не передаёт. Запуск вручную: Actions → «Скачать базы ClamAV (вручную)» → Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download:
    name: Скачать main, daily, bytecode
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Скачать базы (официальной программой обновления, как это делает сам ClamAV)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq clamav-freshclam
          mkdir -p db
          printf 'DatabaseDirectory %s\nDatabaseMirror database.clamav.net\nDNSDatabaseInfo current.cvd.clamav.net\nMaxAttempts 3\n' "$PWD/db" > freshclam.conf
          freshclam --config-file=freshclam.conf --foreground
          for f in main daily bytecode; do
            ls -l db/$f.c?d
            [ "$(head -c 10 db/$f.c?d)" = "ClamAV-VDB" ] || { echo "::error::$f: нет базы"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: clamav-db
          path: db/*.c?d
          retention-days: 3
