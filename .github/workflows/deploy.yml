name: Деплой

# Выкладка на домашний сервер (docs/02-ARCHITECTURE.md §3.3) — только после зелёного CI на main.
# Ручной запуск: Actions → «Деплой» → Run workflow; флаг «проверка отката» намеренно ломает API.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      simulate_broken_api:
        description: 'Проверка отката: новая сборка API намеренно не запустится'
        type: boolean
        default: false
      server:
        description: 'Адрес другого сервера (переезд, ADR-115); пусто — основной сервер'
        type: string
        default: ''

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Выкладка на сервер
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SERVER: deploy@${{ inputs.server || '95.105.7.135' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Ключ доступа к серверу
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error title=Нет секрета DEPLOY_SSH_KEY::Добавьте секрет в Settings → Secrets and variables → Actions (инструкция — docs/00-OWNER-DECISIONS.md §2)"
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
      - name: Деплой
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          SIMULATE: ${{ inputs.simulate_broken_api && '1' || '0' }}
          YOOKASSA_SECRET_KEY: ${{ secrets.YOOKASSA_SECRET_KEY }}
          ADMIN_LOGIN: ${{ secrets.ADMIN_LOGIN }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          VK_GROUP_TOKEN: ${{ secrets.VK_GROUP_TOKEN }}
          VK_GROUP_ID: ${{ secrets.VK_GROUP_ID }}
          VK_GROUP_SCREEN_NAME: ${{ secrets.VK_GROUP_SCREEN_NAME }}
          VK_CALLBACK_SECRET: ${{ secrets.VK_CALLBACK_SECRET }}
          VK_CALLBACK_CONFIRMATION: ${{ secrets.VK_CALLBACK_CONFIRMATION }}
          ROBOKASSA_PASSWORD1: ${{ secrets.ROBOKASSA_PASSWORD1 }}
          ROBOKASSA_PASSWORD2: ${{ secrets.ROBOKASSA_PASSWORD2 }}
          ROBOKASSA_PASSWORD3: ${{ secrets.ROBOKASSA_PASSWORD3 }}
        run: |
          # Переменные передаются через stdin, чтобы токен не попадал в список процессов на сервере.
          set +e
          {
            printf 'export GH_TOKEN=%q REPO=%q DEPLOY_SHA=%q SIMULATE_BROKEN_API=%q YOOKASSA_SECRET_KEY=%q ADMIN_LOGIN=%q ADMIN_PASSWORD=%q VK_GROUP_TOKEN=%q VK_GROUP_ID=%q VK_GROUP_SCREEN_NAME=%q VK_CALLBACK_SECRET=%q VK_CALLBACK_CONFIRMATION=%q ROBOKASSA_PASSWORD1=%q ROBOKASSA_PASSWORD2=%q ROBOKASSA_PASSWORD3=%q\n' "$GH_TOKEN" "$GITHUB_REPOSITORY" "$DEPLOY_SHA" "$SIMULATE" "$YOOKASSA_SECRET_KEY" "$ADMIN_LOGIN" "$ADMIN_PASSWORD" "$VK_GROUP_TOKEN" "$VK_GROUP_ID" "$VK_GROUP_SCREEN_NAME" "$VK_CALLBACK_SECRET" "$VK_CALLBACK_CONFIRMATION" "$ROBOKASSA_PASSWORD1" "$ROBOKASSA_PASSWORD2" "$ROBOKASSA_PASSWORD3"
            cat infra/deploy.sh
          } | ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 "$SERVER" 'bash -s' 2>&1 | tee deploy.log
          status=${PIPESTATUS[1]}
          {
            echo "### Деплой ${DEPLOY_SHA:0:12}: $([ "$status" = 0 ] && echo 'успешно' || echo "ошибка (код $status)")"
            printf '```\n%s\n```\n' "$(grep -vE 'x-access-token' deploy.log | tail -n 60)"
          } >> "$GITHUB_STEP_SUMMARY"
          # Итог — в аннотации, чтобы его было видно без скачивания журнала.
          TXT="$(grep -E '^(✓|✗|→|⚠|  !|BST)' deploy.log | tail -n 30 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
          if [ "$status" = 0 ]; then echo "::notice title=Деплой::$TXT"; exit 0; fi
          if [ "$status" = 3 ]; then
            # Сервер ещё не подготовлен владельцем — это ожидание, а не поломка: не шлём письмо «Run failed».
            echo "::warning title=Деплой ждёт подготовки сервера::$TXT"
            exit 0
          fi
          echo "::error title=Деплой (код $status)::$TXT"
          exit "$status"
      - name: Итог
        if: always()
        run: rm -f ~/.ssh/deploy_key
