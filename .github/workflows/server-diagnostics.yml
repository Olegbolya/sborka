name: Диагностика сервера

# Ручной запуск: Actions → «Диагностика сервера» → Run workflow.
# Показывает релиз, процессы blokum-*, здоровье API/сайта/воркера, диск и последние ошибки (без секретов).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostics:
    name: Состояние Блокума на сервере
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Диагностика
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          [ -n "$KEY" ] || { echo "::error::Нет секрета DEPLOY_SSH_KEY (docs/00-OWNER-DECISIONS.md §2)"; exit 1; }
          install -m 700 -d ~/.ssh && printf '%s\n' "$KEY" > ~/.ssh/k && chmod 600 ~/.ssh/k
          OUT="$(ssh -i ~/.ssh/k -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 deploy@95.105.7.135 'bash -s' < infra/diagnostics.sh 2>&1 | head -c 6000)"
          rm -f ~/.ssh/k
          echo "$OUT"
          echo "### Диагностика сервера" >> "$GITHUB_STEP_SUMMARY"
          printf '```\n%s\n```\n' "$OUT" >> "$GITHUB_STEP_SUMMARY"
